<div id="three-container" class="w-full h-[400px] relative mx-auto my-6 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700"></div>

<!-- Importmap for Three.js ES Modules -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('three-container');

  if (container) {
    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1, 4);

    // 2. WebGL Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // 3. Lighting (Ambient + Directional lights for realistic shading)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
    mainLight.position.set(5, 10, 7.5);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x90e0ef, 1.0); // Subtle blue fill light
    fillLight.position.set(-5, -5, -5);
    scene.add(fillLight);

    // 4. Rotation Controls with Momentum / Inertia
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;      // Enables momentum / friction physics
    controls.dampingFactor = 0.05;      // Momentum speed (lower = slipperier)
    controls.enableZoom = false;        // Disables zooming
    controls.enablePan = false;         // Disables moving/panning away
    controls.autoRotate = false;        // Set to true if you want slow idle spinning

    // 5. Load 3D Model (.glb / .gltf) or Fallback Shape
    const modelUrl = '{{ .Get "src" }}';

    if (modelUrl) {
      const loader = new GLTFLoader();
      loader.load(
        modelUrl,
        (gltf) => {
          const model = gltf.scene;
          
          // 1. Write the Vertex Shader (Handles 3D positioning)
          const vertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              vNormal = normalize(normalMatrix * normal);
              vViewPosition = -mvPosition.xyz;
              gl_Position = projectionMatrix * mvPosition;
            }
          `;

          // 2. Write the Fragment Shader (Handles the Pearlescent Color Math)
          const fragmentShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
              vec3 normal = normalize(vNormal);
              vec3 viewDir = normalize(vViewPosition);

              // Calculate viewing angle (Fresnel)
              float fresnel = 1.0 - max(dot(normal, viewDir), 0.0);
              float fPow = pow(fresnel, 2.5); // Push effect to the curved edges

              // White pearl base
              vec3 baseColor = vec3(0.95, 0.95, 0.95);

              // Sine wave color shifting (Generates the purple/pink/cyan sheen)
              vec3 iridescence = vec3(
                0.7 + 0.3 * sin(fresnel * 12.0),         
                0.4 + 0.4 * sin(fresnel * 12.0 + 2.0),   
                0.8 + 0.2 * sin(fresnel * 12.0 + 4.0)    
              );

              // Blend the white base with the colorful edges
              vec3 finalColor = mix(baseColor, iridescence, fPow * 1.5);

              // Add a fake, sharp glossy reflection to make it look smooth
              vec3 lightDir = normalize(vec3(1.0, 2.0, 1.0));
              vec3 halfVector = normalize(lightDir + viewDir);
              float specular = pow(max(dot(normal, halfVector), 0.0), 80.0);

              gl_FragColor = vec4(finalColor + vec3(specular * 0.6), 1.0);
            }
          `;

          // 3. Apply the raw GLSL shader to your material
          const customPearlMaterial = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader
          });

          // 4. Overwrite everything on the mesh
          model.traverse((child) => {
            if (child.isMesh) {
              child.material = customPearlMaterial;
              child.geometry.computeVertexNormals(); // Ensure smooth shading
            }
          });
          
          // Auto-center the coin
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);
          
          scene.add(model);
        },
        undefined,
        (err) => console.error('Error loading GLTF model:', err)
      );
    } else {
      // Default placeholder 3D shape if no file is provided
      const geometry = new THREE.TorusKnotGeometry(0.8, 0.3, 100, 16);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x6366f1, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
    }

    // 6. Animation Loop (Required for Damping / Momentum to work)
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // Applies the momentum decay frame-by-frame
      renderer.render(scene, camera);
    }
    animate();

    // 7. Responsive Resizing
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  }
</script>
